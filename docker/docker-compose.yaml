services:

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clubs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project-net

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: clubs
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true}
      TYPEORM_DROP_SCHEMA: ${TYPEORM_DROP_SCHEMA:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      ALLOW_DUMMY_REGISTER: "true"
      ALLOW_DUMMY_ADMIN: "true"
      AUTO_SEED: "true"
      AVAILABLE_SEATS_CACHE_TTL_MS: 30000
      BOOKING_DAY_START_HOUR: 8
      BOOKING_DAY_END_HOUR: 23
    depends_on:
      - postgres
    networks:
      - project-net
    ports:
      - "12000:3000"

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-/graphql}
        VITE_BASE_PATH: /
        VITE_YMAPS_API_KEY: ${VITE_YMAPS_API_KEY:-7220b34d-c5b5-4211-8034-0063d1473c72}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - project-net
    ports:
      - "13000:4173"

networks:
  project-net:

volumes:
  postgres_data:
