services:

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clubs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project-net

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: clubs
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      ALLOW_DUMMY_REGISTER: "true"
      ALLOW_DUMMY_ADMIN: "true"
      AUTO_SEED: "true"
      AVAILABLE_SEATS_CACHE_TTL_MS: 30000
      BOOKING_DAY_START_HOUR: 8
      BOOKING_DAY_END_HOUR: 23
    depends_on:
      - postgres
    networks:
      - project-net
    ports:
      - "12000:3000"

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_GRAPHQL_URL: http://localhost:12000/graphql
        VITE_BASE_PATH: /
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - project-net
    ports:
      - "13000:4173"

networks:
  project-net:

volumes:
  postgres_data:
